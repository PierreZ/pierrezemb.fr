# https://codeberg.org/alanpearce/zola-bearblog/src/branch/main/config.toml
# The URL the site will be built for
base_url = "https://pierrezemb.fr"
title = "Pierre Zemb's Blog"
description = "Pierre Zemb personal blog"

# Local custom theme, linked via flake shellHook into themes/
theme = "zola-quorum-schematics"

taxonomies = [
  { name = "tags", feed = true },
]

generate_feeds = true
feed_filenames = [
  "atom.xml",
  "rss.xml"
]

author = "Pierre Zemb"

# Theme ships plain CSS; no sass directory to compile
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

[markdown]
insert_anchor_links = "right"

[markdown.highlighting]
style = "class"
light_theme = "solarized-light"
dark_theme = "solarized-dark"

[search]
include_title = true
include_description = true
include_content = true

[extra]
logo = "Pierre Zemb"
avatar = "images/myself.jpg"
prompt_user = "root@pierrezemb.fr"
prompt_path = "~/blog"
read_replica = "node-0"
cluster_enabled = true
home_post_limit = 5
read_modes = true
default_read_mode = "quorum"
theme_color = "#15324d"
copyright = "© 2026 Pierre Zemb"
og_image = "images/myself.jpg"
og_locale = "en_US"

[extra.search]
enabled = true

[extra.plausible]
# Per-site script (Oct 2025+): loads pa-*.js and self-bootstraps via plausible.init()
src = "https://plausible.io/js/pa-YUTyBK3EWpBoZR4gYgoZp.js"

[extra.twitter]
site = "@PierreZ"
creator = "@PierreZ"

[[extra.nav]]
name = "Home"
url = "$BASE_URL/"

[[extra.nav]]
name = "Blog"
url = "$BASE_URL/posts/"

[[extra.nav]]
name = "Tags"
url = "$BASE_URL/tags/"

[[extra.nav]]
name = "Talks"
url = "$BASE_URL/talks/"

[[extra.nav]]
name = "Podcasts"
url = "$BASE_URL/podcasts/"

[[extra.nav]]
name = "Contact"
url = "$BASE_URL/contact/"

[[extra.social]]
name = "github"
url = "https://github.com/PierreZ"

[[extra.social]]
name = "twitter"
url = "https://x.com/PierreZ"

[[extra.social]]
name = "bluesky"
url = "https://bsky.app/profile/pierrezemb.fr"
