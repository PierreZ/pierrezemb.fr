{%- set src = "https://www.youtube-nocookie.com/embed/" ~ id -%}
{%- if autoplay %}{%- set src = src ~ "?autoplay=1" -%}{%- endif -%}
<div class="embed-video {{ class | default(value='') }}">
  <iframe src="{{ src }}" title="{{ title | default(value='YouTube video') }}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
</div>
