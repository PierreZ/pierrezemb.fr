<div class="topnav">
  <a class="logo" href="{{ config.base_url | safe }}">{{ config.extra.logo | default(value=config.title) }}</a>
  <nav>
    {%- if config.extra.nav %}
      {%- for item in config.extra.nav %}
      <a href="{{ item.url | replace(from='$BASE_URL', to=config.base_url) | safe }}">{{ item.name }}</a>
      {%- endfor %}
    {%- else %}
      <a href="{{ config.base_url | safe }}">home</a><a href="{{ get_url(path='@/posts/_index.md') | safe }}">blog</a><a href="{{ get_url(path='tags') | safe }}">tags</a>
    {%- endif %}
  </nav>
  {%- if config.extra.search.enabled | default(value=false) %}
  <div class="nav-search">
    <input type="search" id="search" placeholder="search…" autocomplete="off" aria-label="search posts">
    <div class="search-results" id="search-results"></div>
  </div>
  {%- endif %}
  <button class="flip" id="flipbtn" type="button" aria-label="toggle color theme">⊕ dark</button>
</div>
